name: prerelease

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      # Key-only SSH server for the hidden developer options, static for both
      # architectures; the recipe lives in scripts/build-dropbear.sh.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Build bundled SSH server
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do bash scripts/build-dropbear.sh "$arch" bin; done
          file bin/dropbear-x86_64 | grep -q 'x86-64.*statically linked'
          file bin/dropbear-aarch64 | grep -q 'ARM aarch64.*statically linked'
          bin/dropbear-x86_64 dropbearkey -t ed25519 -f "$RUNNER_TEMP/smoke_key" >/dev/null

      - name: Build and package prerelease
        env:
          BRANCH: ${{ github.ref_name }}
          PLUGIN_NAME: Panel de Control
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE="$(node -p "require('./package.json').version")"
          export VERSION="${BASE}-dev.${SHORT_SHA}"
          node -e "const f='package.json';const p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
          echo "Building $PLUGIN_NAME v${VERSION} from ${BRANCH}"
          pnpm install --frozen-lockfile
          pnpm test:i18n
          pnpm test:fe tests/pluginPayload.test.ts
          pnpm build
          staging=$(mktemp -d)
          node scripts/copy-plugin-payload.mjs . "$staging/$PLUGIN_NAME"
          (cd "$staging" && zip -r "$GITHUB_WORKSPACE/$PLUGIN_NAME.zip" "$PLUGIN_NAME")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Panel de Control-${{ env.VERSION }}
          path: Panel de Control.zip
          retention-days: 14

name: Theme promote

on:
  workflow_call:
    inputs:
      catalog_id:
        required: true
        type: string
      version:
        required: true
        type: string
      initial_baseline_directory:
        required: true
        type: string
      confirmation:
        required: true
        type: string

permissions: {}

concurrency:
  group: theme-pages-publication
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.repository == 'Hooandee/panel-de-control' &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.confirmation == format('PROMOTE {0}', inputs.version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: theme-pages-promote
    permissions:
      contents: read
      pages: write
    outputs:
      pages_base: ${{ steps.pages-api.outputs.base }}
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Read the authoritative default Pages URL
        id: pages-api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_json="$(gh api "repos/$GITHUB_REPOSITORY/pages")"
          pages_base="$(jq -r '.html_url // empty' <<<"$pages_json")"
          cname="$(jq -r '.cname // empty' <<<"$pages_json")"
          test -n "$pages_base"
          test -z "$cname"
          case "$pages_base" in
            https://*.github.io|https://*.github.io/*) ;;
            *) echo "::error::Pages must use the default GitHub domain"; exit 1 ;;
          esac
          echo "base=${pages_base%/}" >> "$GITHUB_OUTPUT"
      - name: Configure the existing Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Validate promotion tooling
        working-directory: source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm vitest run tests/themePublicationContract.test.ts tests/themePagesPromote.test.ts tests/themePagesGovernance.test.ts tests/themeWorkflow.test.ts
      - name: Require the audited Pages governance
        env:
          GH_TOKEN: ${{ secrets.THEME_PAGES_AUDIT_TOKEN }}
          THEME_PAGES_AUDIT_TOKEN: ${{ secrets.THEME_PAGES_AUDIT_TOKEN }}
          DEPLOY_KEY_ID: ${{ vars.THEME_PAGES_DEPLOY_KEY_ID }}
          RULESET_ID: ${{ vars.THEME_PAGES_RULESET_ID }}
          RULESET_UPDATED_AT: ${{ vars.THEME_PAGES_RULESET_UPDATED_AT }}
        working-directory: source
        run: |
          set -euo pipefail
          case "$RULESET_ID" in ''|*[!0-9]*) exit 1 ;; esac
          case "$DEPLOY_KEY_ID" in ''|*[!0-9]*) exit 1 ;; esac
          test -n "$RULESET_UPDATED_AT"
          test -n "$THEME_PAGES_AUDIT_TOKEN"
          ruleset_path="$RUNNER_TEMP/theme-pages-ruleset.json"
          keys_path="$RUNNER_TEMP/theme-pages-deploy-keys.json"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID" > "$ruleset_path"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/keys?per_page=100" > "$keys_path"
          node scripts/verify-theme-pages-governance.mjs "$ruleset_path" "$keys_path" "$GITHUB_REPOSITORY" "$RULESET_ID" "$RULESET_UPDATED_AT" "$DEPLOY_KEY_ID"
      - name: Require the protected Pages deploy key
        env:
          THEME_PAGES_DEPLOY_KEY: ${{ secrets.THEME_PAGES_DEPLOY_KEY }}
        run: test -n "$THEME_PAGES_DEPLOY_KEY"
      - name: Checkout durable Pages tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: pages-tree
          fetch-depth: 1
          ssh-key: ${{ secrets.THEME_PAGES_DEPLOY_KEY }}
      - name: Verify the live immutable candidate before promotion
        env:
          PAGES_BASE: ${{ steps.pages-api.outputs.base }}
          VERSION: ${{ inputs.version }}
        working-directory: source
        run: node scripts/verify-theme-pages.mjs "$PAGES_BASE" "${{ inputs.catalog_id }}" "$VERSION" immutable "../pages-tree/themes/v1/${{ inputs.catalog_id }}/$VERSION"
      - name: Promote the exact immutable descriptor
        env:
          PAGES_BASE: ${{ steps.pages-api.outputs.base }}
          VERSION: ${{ inputs.version }}
        working-directory: source
        run: node scripts/promote-theme-pages.mjs ../pages-tree "$PAGES_BASE" "${{ inputs.catalog_id }}" "$VERSION" "${{ inputs.initial_baseline_directory }}"
      - name: Commit only latest.json
        env:
          VERSION: ${{ inputs.version }}
        working-directory: pages-tree
        run: |
          set -euo pipefail
          latest_path="themes/v1/${{ inputs.catalog_id }}/latest.json"
          git add -- "$latest_path"
          changed="$(git diff --cached --name-only)"
          if test -z "$changed"; then
            echo "Version is already live"
            exit 0
          fi
          test "$changed" = "$latest_path"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "theme: promote ${{ inputs.catalog_id }} $VERSION"
          git push origin HEAD:gh-pages
      - name: Prepare the complete Pages artifact
        run: |
          set -euo pipefail
          mkdir deploy-tree
          rsync -a --exclude=.git pages-tree/ deploy-tree/
      - name: Upload the complete Pages tree
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: deploy-tree

  deploy:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy the complete durable tree
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    needs: [promote, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout verification tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          persist-credentials: false
      - name: Checkout the reviewed Pages tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: pages-tree
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verify the served immutable and latest descriptors
        env:
          PAGES_BASE: ${{ needs.promote.outputs.pages_base }}
        run: node source/scripts/verify-theme-pages.mjs "$PAGES_BASE" "${{ inputs.catalog_id }}" "${{ inputs.version }}" latest "pages-tree/themes/v1/${{ inputs.catalog_id }}/${{ inputs.version }}"

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: CI only reads the repo. No job here writes anything, and a
# read-only token means a compromised dependency in a build step cannot push,
# open PRs, or tamper with releases.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      decky: ${{ steps.filter.outputs.decky }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            decky:
              - ".github/workflows/ci.yml"
              - "src/**"
              - "py_modules/**"
              - "tests/**"
              - "conftest.py"
              - "main.py"
              - "package.json"
              - "pnpm-lock.yaml"
              - "tsconfig.json"
              - "rollup.config.js"
              - "requirements*.txt"
              - "plugin.json"
              - "assets/**"
              - "bin/**"
              - "scripts/**"

  backend-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Decky paths unchanged
        if: needs.changes.outputs.decky != 'true'
        run: echo "Decky backend tests not required for these paths"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.changes.outputs.decky == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: needs.changes.outputs.decky == 'true'
        with:
          python-version: "3.11"
      - if: needs.changes.outputs.decky == 'true'
        run: pip install -r requirements-dev.txt
      - if: needs.changes.outputs.decky == 'true'
        run: ruff check py_modules main.py tests
      - if: needs.changes.outputs.decky == 'true'
        run: python -m pytest -v

  frontend-build:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Decky paths unchanged
        if: needs.changes.outputs.decky != 'true'
        run: echo "Decky frontend build not required for these paths"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: needs.changes.outputs.decky == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.decky == 'true'
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.decky == 'true'
        with:
          node-version: 20
          cache: pnpm
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm test:fe
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm build
      - name: Verify build output exists
        if: needs.changes.outputs.decky == 'true'
        run: test -f dist/index.js

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: CI only reads the repo. No job here writes anything, and a
# read-only token means a compromised dependency in a build step cannot push,
# open PRs, or tamper with releases.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decky: ${{ steps.filter.outputs.decky }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: every
          filters: |
            decky:
              - "**"
              - "!opengamepadui/**"
              - "!.github/workflows/opengamepadui-ci.yml"
              - "!windows/**"
              - "!.github/workflows/windows-ci.yml"

  backend-tests:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.decky != 'true' &&
          needs.changes.outputs.decky != 'false')
        run: |
          echo "::error::Decky path classification failed or returned an invalid output"
          exit 1
      - name: Decky paths unchanged
        if: needs.changes.outputs.decky == 'false'
        run: echo "Decky backend tests not required for these paths"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.decky == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.decky == 'true'
        with:
          python-version: "3.11"
      - if: needs.changes.outputs.decky == 'true'
        run: pip install -r requirements-dev.txt
      - if: needs.changes.outputs.decky == 'true'
        run: ruff check py_modules main.py tests
      - if: needs.changes.outputs.decky == 'true'
        run: python -m pytest -v

  frontend-build:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful path classification
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.decky != 'true' &&
          needs.changes.outputs.decky != 'false')
        run: |
          echo "::error::Decky path classification failed or returned an invalid output"
          exit 1
      - name: Decky paths unchanged
        if: needs.changes.outputs.decky == 'false'
        run: echo "Decky frontend build not required for these paths"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.decky == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: needs.changes.outputs.decky == 'true'
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.decky == 'true'
        with:
          node-version: 20
          cache: pnpm
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm test:fe
      - if: needs.changes.outputs.decky == 'true'
        run: pnpm build
      - name: Verify build output exists
        if: needs.changes.outputs.decky == 'true'
        run: test -f dist/index.js

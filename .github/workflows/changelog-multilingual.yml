name: changelog-multilingual

# Blocks release PRs whose newest CHANGELOG.md section is not complete in every
# supported interface language. This validates structure; catalog wording and
# terminology are reviewed by the translation-content tests in the main CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths: ["CHANGELOG.md"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep the release PR parseable
        env:
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/release_guard.py pr
      - name: Require every supported language
        run: python3 scripts/changelog_notes.py --check

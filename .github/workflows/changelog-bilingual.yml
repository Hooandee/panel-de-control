name: changelog-multilingual

# Blocks a PR whose newest CHANGELOG.md section lacks a Spanish entry for every
# English entry or contains an incomplete Italian translation. Separate Español,
# English and Italiano blocks are preferred; Release Please's unlabelled English
# bullets and explicit ES, EN and IT labels remain compatible.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    paths: ["CHANGELOG.md"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Keep the release PR parseable
        env:
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/release_guard.py pr
      - run: python3 scripts/changelog_notes.py --check

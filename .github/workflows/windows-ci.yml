name: Windows CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/themes/**"
      - "src/windowsThemeHost/**"
      - ".github/workflows/windows-ci.yml"
      - "windows/**"
      - "shared/fixtures/**"
      - "shared/devices/**"
  pull_request:
    paths:
      - "src/themes/**"
      - "src/windowsThemeHost/**"
      - ".github/workflows/windows-ci.yml"
      - "windows/**"
      - "shared/fixtures/**"
      - "shared/devices/**"
  # release-please calls this for every published Panel release: the package takes the release
  # version and the installer is attached to that release.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}-${{ inputs.release_tag || 'ci' }}
  cancel-in-progress: true

jobs:
  theme-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run src/windowsThemeHost src/themes/runtime
      - run: pnpm build:windows-theme-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-theme-host
          path: dist/windows/steam-theme-host.js
          if-no-files-found: error

  core-tests:
    runs-on: windows-latest
    needs: theme-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-theme-host
          path: dist/windows
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: >-
          python -m unittest
          opengamepadui.tests.test_package.WorkflowIsolationTests
      - run: python -m unittest windows.tests.test_gamebar_package
      - run: >-
          dotnet restore
          windows/tests/PanelDeControl.Core.Tests/PanelDeControl.Core.Tests.csproj
          --locked-mode
      - run: >-
          dotnet restore
          windows/tests/PanelDeControl.Hardware.Tests/PanelDeControl.Hardware.Tests.csproj
          --locked-mode
      - run: >-
          dotnet test
          windows/tests/PanelDeControl.Core.Tests/PanelDeControl.Core.Tests.csproj
          --configuration Release
          --no-restore
      - run: >-
          dotnet test
          windows/tests/PanelDeControl.Hardware.Tests/PanelDeControl.Hardware.Tests.csproj
          --configuration Release
          --no-restore
      - run: >-
          dotnet restore
          windows/tests/PanelDeControl.Service.Tests/PanelDeControl.Service.Tests.csproj
          --locked-mode
      - run: >-
          dotnet test
          windows/tests/PanelDeControl.Service.Tests/PanelDeControl.Service.Tests.csproj
          --configuration Release
          --no-restore

  service-package:
    runs-on: windows-latest
    needs: theme-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-theme-host
          path: dist/windows
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: >-
          dotnet restore
          windows/src/PanelDeControl.Service/PanelDeControl.Service.csproj
          --locked-mode
          --configfile windows/NuGet.ci.config
      - run: >-
          dotnet publish
          windows/src/PanelDeControl.Service/PanelDeControl.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/service
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-de-control-service-x64
          path: artifacts/service/**
          if-no-files-found: error

  gamebar-package:
    runs-on: windows-2022
    needs: theme-host
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages\
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-theme-host
          path: dist/windows
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - name: Stamp the release version on the package
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '(\d+)\.(\d+)\.(\d+)$') { throw "Unexpected release tag $env:RELEASE_TAG" }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $manifest = 'windows/src/PanelDeControl.GameBar/Package.appxmanifest'
          $text = Get-Content -Raw $manifest
          $stamped = [regex]::Replace($text, '(<Identity[^>]*\sVersion=")[^"]+(")', "`${1}$version`${2}")
          if ($stamped -eq $text) { throw 'The package version was not stamped' }
          Set-Content -NoNewline -Path $manifest -Value $stamped
          "Package version $version"
      - shell: pwsh
        run: >-
          dotnet restore
          windows/src/PanelDeControl.Hardware/PanelDeControl.Hardware.csproj
          --locked-mode
          --configfile windows/NuGet.ci.config
      - shell: pwsh
        run: >-
          msbuild
          windows/src/PanelDeControl.GameBar/PanelDeControl.GameBar.csproj
          /target:Restore
          /property:RestorePackagesWithLockFile=true
          /property:RestoreForceEvaluate=true
          /property:RestoreConfigFile=${{ github.workspace }}\windows\NuGet.ci.config
          /property:Configuration=Release
          /property:Platform=x64
      - run: >-
          git diff --exit-code --
          windows/src/PanelDeControl.GameBar/packages.lock.json
          windows/src/PanelDeControl.Core/packages.lock.json
      - shell: pwsh
        run: >-
          msbuild
          windows/src/PanelDeControl.GameBar/PanelDeControl.GameBar.csproj
          /restore
          /target:Build
          /property:RestoreLockedMode=true
          /property:RestoreConfigFile=${{ github.workspace }}\windows\NuGet.ci.config
          /property:Configuration=Release
          /property:Platform=x64
          /property:AppxPackageSigningEnabled=false
          /property:GenerateAppxPackageOnBuild=true
          /property:AppxBundle=Never
          /property:UapAppxPackageBuildMode=SideloadOnly
          /property:AppxPackageDir=${{ github.workspace }}\artifacts\gamebar\
      # Panel's own certificate (windows/installer/PanelDeControl.cer); the installer trusts it for app
      # packages only. Pull requests from forks have no secret and keep an unsigned development package.
      - name: Sign the widget package
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) { 'No signing certificate: the package stays unsigned'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          try {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe was not found' }
            $packages = Get-ChildItem -Path artifacts/gamebar -Recurse -Filter '*.msix' -File |
              Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' }
            if (-not $packages) { throw 'No widget package to sign' }
            foreach ($package in $packages) {
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD $package.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($package.Name)" }
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-de-control-gamebar-x64
          path: artifacts/gamebar/**
          if-no-files-found: error

  installer:
    runs-on: windows-2022
    needs: [gamebar-package, service-package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-de-control-gamebar-x64
          path: artifacts/gamebar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-de-control-service-x64
          path: artifacts/service
      - name: Lay out the installer payload
        shell: pwsh
        run: |
          $payload = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-payload'
          New-Item -ItemType Directory -Force -Path (Join-Path $payload 'Dependencies'), (Join-Path $payload 'service') | Out-Null
          $msix = Get-ChildItem -Path artifacts/gamebar -Recurse -Filter '*.msix' -File |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } | Select-Object -First 1
          if (-not $msix) { throw 'The Game Bar artifact has no .msix' }
          Copy-Item $msix.FullName (Join-Path $payload 'PanelDeControl.msix')
          Get-ChildItem -Path artifacts/gamebar -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]Dependencies[\\/]x64[\\/]' -and $_.Extension -in '.appx', '.msix' } |
            Copy-Item -Destination (Join-Path $payload 'Dependencies')
          Copy-Item -Path artifacts/service/* -Destination (Join-Path $payload 'service') -Recurse
          Copy-Item -Path windows/installer/PanelDeControl.cer -Destination $payload
          if (-not (Test-Path (Join-Path $payload 'service/PanelDeControl.Service.exe'))) { throw 'The service artifact has no PanelDeControl.Service.exe' }
          Get-ChildItem -Recurse $payload | Select-Object -ExpandProperty FullName
      - name: Build the installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $env:PDC_VERSION = if ($env:RELEASE_TAG -match '(\d+\.\d+\.\d+)$') { $Matches[1] } else { '0.0.0-ci' }
          $env:PDC_PAYLOAD = Join-Path $env:GITHUB_WORKSPACE 'artifacts/installer-payload'
          & $iscc windows/installer/PanelDeControl.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-de-control-setup-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error

  release-asset:
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    needs: installer
    permissions:
      contents: write # attach the installer to the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel-de-control-setup-x64
          path: installer
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" installer/*.exe --clobber --repo "${{ github.repository }}"

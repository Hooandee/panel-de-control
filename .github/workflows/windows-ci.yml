name: Windows CI

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/windows-ci.yml"
      - "windows/**"
      - "shared/fixtures/**"
  pull_request:
    paths:
      - ".github/workflows/windows-ci.yml"
      - "windows/**"
      - "shared/fixtures/**"

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: >-
          python -m unittest
          opengamepadui.tests.test_package.WorkflowIsolationTests
      - run: dotnet restore windows/PanelDeControl.sln --locked-mode
      - run: dotnet build windows/PanelDeControl.sln --configuration Release --no-restore
      - run: dotnet test windows/PanelDeControl.sln --configuration Release --no-build
